disabled_rules:
  - trailing_whitespace
  - force_cast
  - todo # Allow TODO comments during development
  - missing_docs # Skip documentation requirements
  - file_header # Skip file header requirements
  - void_return
  - opening_brace # Allow brace placement flexibility
  - closing_brace # Allow closing brace flexibility
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - force_unwrapping
  - empty_count

included:
  - Sources
  - Tests
  - CashFlow Finder
  - LocalPackages/CashFlowFinderLibrary/Sources
  - CashFlow FinderTests
  - CashFlow FinderUITests

excluded:
  - Pods/
  - Carthage/
  - build/
  - DerivedData
  - fastlane
  - .github
  - .swiftlint.yml


line_length:
  warning: 200
  error: 220
  ignores_comments: true
  ignores_urls: true
  
# Custom rules
custom_rules:
  swiftui_state_private:
    name: "SwiftUI @State should be private"
    regex: '^[ \t]*@State[ \t]+(var|let)'
    message: "@State properties should be private"
    severity: warning

reporter: xcode

